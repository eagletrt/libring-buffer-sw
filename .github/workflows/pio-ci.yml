name: PlatformIO Library CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ !(github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') }}
    strategy:
      matrix:
        example: [examples/ring-buffer-basic.c]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build Examples
        run: pio ci -l . --board=disco_h747xi --board=genericSTM32F446RE --exclude=src/test --exclude=src/examples -O "framework=stm32cube"
        env:
          PLATFORMIO_CI_SRC: ${{ matrix.example }}
